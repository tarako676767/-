<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツムツム 処理実行パネル</title>
    <style>
        :root {
            --bg-color: #1e1f22;
            --card-bg: #2b2d31;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-color: #f2f3f5;
            --text-muted: #949ba4;
            --success-color: #23a55a;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h3 {
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 8px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        .action-card {
            background-color: #111214;
            border: 1px solid #3f4147;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .action-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #111214;
            border: 1px solid #3f4147;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 4px;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button.success { background-color: var(--success-color); }
        .log-box {
            background-color: #111214;
            border: 1px solid #3f4147;
            border-radius: 4px;
            padding: 15px;
            height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #3ba55d;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background-color: #313338;
            flex: 1;
        }
        .tab-btn.active {
            background-color: var(--accent-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- アカウント切替 -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('normal')">通常アカウント (LINE)</button>
        <button class="tab-btn" onclick="switchTab('guest')">ゲストアカウント (引き継ぎ)</button>
    </div>

    <!-- 通常アカウント情報 -->
    <div id="tab-normal" class="tab-content active card">
        <h3>LINE ログイン情報</h3>
        <div class="grid-2">
            <div>
                <label>メールアドレス / ID</label>
                <input type="text" id="line_id" placeholder="example@line.me">
            </div>
            <div>
                <label>パスワード</label>
                <input type="password" id="line_password" placeholder="••••••••">
            </div>
        </div>
    </div>

    <!-- ゲストアカウント情報 -->
    <div id="tab-guest" class="tab-content card">
        <h3>ゲスト アカウント情報</h3>
        <div class="grid-2">
            <div>
                <label>引き継ぎ番号</label>
                <input type="text" id="guest_id" placeholder="12345678">
            </div>
            <div>
                <label>パスワード</label>
                <input type="password" id="guest_password" placeholder="••••••••">
            </div>
        </div>
    </div>

    <!-- メニュー・ボタン一覧 -->
    <div class="card">
        <h3>ツムツム機能メニュー</h3>
        
        <div class="grid-2" style="margin-bottom: 15px;">
            <div>
                <label>使用ツムID (デフォルト: 860)</label>
                <input type="number" id="tsum_id" value="860">
            </div>
            <div>
                <label>プロキシ (任意)</label>
                <input type="text" id="proxy" placeholder="http://user:pass@host:port">
            </div>
        </div>

        <div class="grid-buttons">
            <!-- コイン指定 -->
            <div class="action-card">
                <button onclick="promptAndRun('coin', 'コイン数を入力してください (0〜2億)', 100000000)">コイン指定</button>
                <div class="action-desc">0〜2億枚まで指定可能</div>
            </div>

            <!-- コインMAX -->
            <div class="action-card">
                <button onclick="runAction('coin', 200000000)">コインMAX</button>
                <div class="action-desc">コインを2億枚にします</div>
            </div>

            <!-- プレイヤーレベルMAX -->
            <div class="action-card">
                <button onclick="runAction('exp', 1000000000)">プレイヤーレベルMAX</button>
                <div class="action-desc">レベルMAXにします</div>
            </div>

            <!-- スコア指定 -->
            <div class="action-card">
                <button onclick="promptAndRun('score', '送信するスコアを入力してください', 100000000)">スコア指定</button>
                <div class="action-desc">好きなスコアを指定可能</div>
            </div>

            <!-- スコアMAX -->
            <div class="action-card">
                <button onclick="runAction('score', 2100000000)">スコアMAX</button>
                <div class="action-desc">スコアMAXにします</div>
            </div>

            <!-- ツムレベルMAX -->
            <div class="action-card">
                <button class="success" onclick="runAction('tsum_lv', 0)">ツムレベルMAX</button>
                <div class="action-desc">セット中のツムをレベル50</div>
            </div>

            <!-- セレクトBOX完売 -->
            <div class="action-card">
                <button class="success" onclick="promptAndRun('box', 'セレクトBOX IDを入力してください (空欄で自動)', 1)">セレクトBOX完売</button>
                <div class="action-desc">完売まで</div>
            </div>

            <!-- プレミアム完売 -->
            <div class="action-card">
                <button class="success" onclick="promptAndRun('gacha_full', 'プレミアムガチャ IDを入力してください (空欄で自動)', 11)">プレミアム完売</button>
                <div class="action-desc">プレミアムガチャを完売まで</div>
            </div>
        </div>
    </div>

    <!-- ログ -->
    <div class="card">
        <h3>実行ログ</h3>
        <div id="log-output" class="log-box">待機中...</div>
    </div>
</div>

<script>
    let currentMode = 'normal';

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (mode === 'normal') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-normal').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-guest').classList.add('active');
        }
    }

    function appendLog(msg) {
        const logBox = document.getElementById('log-output');
        const now = new Date().toLocaleTimeString();
        logBox.innerText = `[${now}] ${msg}\n\n` + logBox.innerText;
    }

    function promptAndRun(type, promptText, defaultValue) {
        const val = prompt(promptText, defaultValue);
        if (val !== null && val !== "") {
            runAction(type, parseInt(val) || val);
        }
    }

    async function runAction(actionType, value) {
        const payload = {
            mode: currentMode,
            tsumid: parseInt(document.getElementById('tsum_id').value) || 860,
            proxy: document.getElementById('proxy').value || null
        };

        if (currentMode === 'normal') {
            payload.login_id = document.getElementById('line_id').value;
            payload.password = document.getElementById('line_password').value;
            if (!payload.login_id || !payload.password) {
                alert("LINE ログイン情報を入力してください。");
                return;
            }
        } else {
            payload.migration_id = document.getElementById('guest_id').value;
            payload.password = document.getElementById('guest_password').value;
            if (!payload.migration_id || !payload.password) {
                alert("ゲスト引き継ぎ情報を入力してください。");
                return;
            }
        }

        payload[actionType] = value;

        appendLog(`処理を実行中... [${actionType}: ${value}]`);

        try {
            const response = await fetch('/api/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            appendLog(result.message);
        } catch (error) {
            appendLog("エラーが発生しました: " + error.message);
        }
    }
</script>

</body>
</html>
